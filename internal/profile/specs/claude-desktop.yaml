name: claude-desktop
desc: Claude Desktop (Anthropic), in a graphical window
# kind: gui -- the app owns the console, so there is no binary to exec and
# nothing to pass arguments to.
kind: gui
guiTitle: Claude Desktop
image: ghcr.io/nofireai/urunc-claude-desktop:aarch64
guestHome: /home/claude
# CLAUDE_CODE_OAUTH_REFRESH_TOKEN is opt-in for the same reason it is in
# claude-code.yaml: it is durable account access rather than the short-lived
# token beside it, so a sandbox gets it only when the user asks --
# BRIG_FORWARD_OPTIN=CLAUDE_CODE_OAUTH_REFRESH_TOKEN.
env:
  - name: CLAUDE_CODE_OAUTH_TOKEN
    ref: env.CLAUDE_CODE_OAUTH_TOKEN
  - name: CLAUDE_CODE_OAUTH_REFRESH_TOKEN
    ref: env.CLAUDE_CODE_OAUTH_REFRESH_TOKEN
    optIn: true
  - name: CLAUDE_CODE_OAUTH_SCOPES
    ref: env.CLAUDE_CODE_OAUTH_SCOPES
  - name: GH_TOKEN
    ref: env.GH_TOKEN
deny: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN]
statePaths: [.config/Claude, .claude]
mem: 6144
cpus: 4
# This profile owns ~/brig/claude-desktop, so a session called "desktop" is
# refused rather than landing a Claude Code session on the Desktop app's
# workspace.
reserved: true
