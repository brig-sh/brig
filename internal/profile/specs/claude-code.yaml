name: claude-code
desc: Claude Code (Anthropic)
binary: claude
image: ghcr.io/brig-sh/claude-code-stock:root

# Boots as an ordinary OCI image: the image carries no kernel, so the
# runtime supplies one. hvi is the backend that path is built around.
hypervisor: hvi
network: isolated
genericBoot: true
# The root account, which is what makes this work on a rootless Linux install:
# rootlesskit maps container uid 0 to the invoking user, so a root guest IS
# that user -- it opens /dev/kvm and owns the workspace it writes. A guest on
# 501 or 1000 lands on a subuid that owns nothing. It costs nothing on macOS,
# where hvi presents the host user's files as uid 0 by default.
#
# brig takes the guest account from the last element of this path.
guestHome: /root

# ~/.claude/skills and ~/.claude/plugins are copied into the guest under
# --skills. Memory is deliberately absent: it is keyed by host project path
# (~/.claude/projects/<slug>/memory), and that slug does not exist in the
# guest, so projecting it would put the files somewhere the agent never looks.
hostConfigDir: ~/.claude
projectPaths: [skills, plugins]

# What this profile needs out of brig's own store, and whether a run without
# it should stop.
#
# Both optional, deliberately. Claude Code completes its own login inside the
# sandbox when nothing supplies a credential -- which is what a host that has
# never run `claude` has always done -- and git reports its own auth error
# without a token. Requiring either would turn both into a refused boot.
#
# sources: are tried in order and the first that exists wins, which is what
# makes this portable without a per-platform predicate. gh-token has none: it
# is hand-created, because `ref: env.GH_TOKEN` below reads the variable LIVE on
# every run while a source would copy it into the keychain once, at import --
# same word, opposite temporal semantics, and the snapshot is the one that goes
# stale without saying so.
secrets:
  - name: claude-credentials
    required: false
    expiryField: expiresAt              # found at any depth; drives the stale warning
    sources:
      - from: keychain
        service: Claude Code-credentials    # macOS keeps it here
      - from: file
        path: ~/.claude/.credentials.json   # the documented Linux location
        hint: run `claude` on the host once to log in

  - name: gh-token
    required: false
    hint: "export GH_TOKEN before running brig, or store one: gh auth token | brig secret create gh-token"

# The whole credential document, byte for byte, at the path Claude Code reads.
#
# Verbatim rather than field-by-field: the host keychain blob IS the format
# .credentials.json takes -- {"claudeAiOauth": {accessToken, refreshToken,
# expiresAt, refreshTokenExpiresAt, scopes[], subscriptionType, rateLimitTier}}
# -- so nothing needs extracting and no field brig does not understand is lost.
#
# The guest is Linux and has no keychain, so this file is the agent's only
# credential store there. File delivery is the native shape, not a workaround
# for the environment variable.
#
# That includes the refresh token, and this is the part worth saying out loud,
# because an earlier design deliberately withheld it: an access token expires
# on its own, while a refresh token mints new ones until the grant is revoked.
# So the guest holds durable account access rather than one session's worth.
#
# Kept anyway, and the reason is the lifetimes. Measured 2026-08-19 on a live
# credential: the access token had 2.9 hours left and the refresh token 98.
# Delivering only the access token would give the sandbox a credential that
# dies within hours, with no way to renew it in the guest -- so every long run
# would stop mid-work and wait for someone to import again on the host. The
# blast radius we accept in exchange is one workspace and whatever the guest
# can reach, which is the same trade the fine-grained GH_TOKEN advice makes.
#
# Two things this rested on and no longer has to. Both measured 2026-08-19,
# in the guest, against a real account:
#
#   - The agent DOES refresh in place. With the access token corrupted and the
#     refresh token intact, it recovered and rewrote this file. With the
#     refresh token removed it could not: "401 OAuth access token is invalid",
#     and the file was left untouched. So the refresh token is what buys a
#     sandbox more than one access token's worth of life, and delivering only
#     the access token would strand a run when that token expired.
#   - The provider rotates the refresh token single-use. The refresh above
#     invalidated the copy on the host, which needed a fresh login -- and the
#     document the guest wrote carries a NEW refresh token that only the guest
#     has. So a refresh in the sandbox costs the host its login.
#
# That last point has a consequence this profile cannot fix on its own, and it
# is worth knowing before trusting a long run: brig re-delivers the stored
# credential on every exec, so once a guest has refreshed, the next brig
# command overwrites the guest's new token with the stored one -- which the
# rotation just invalidated. The sandbox then holds a dead credential, and the
# fix is `brig secret import` on the host after a fresh login there.
#
# It is an ordinary file, written into the tmpfs declared under volumes: below.
# NOT bind-mounted onto its own path: measured 2026-08-18, Claude Code writes
# this file atomically (temp file + renameat), and renameat onto a mountpoint
# returns EBUSY -- so a bind mount there breaks in-guest refresh, and the temp
# file lands on the workspace, which is host disk.
files:
  - ref: secrets.claude-credentials
    path: .claude/.credentials.json
    mode: "0600"                        # measured: what claude itself writes

# What reaches host disk, and what does not.
#
# .claude is tmpfs, so the credential above -- and the temp file the agent
# renames onto it -- never touch the workspace. That is fail-closed by
# construction rather than by inspection: there is no path to the host to
# check.
#
# The hostmounts are the exceptions: state worth keeping across boots, and the
# list is what was actually in a live workspace rather than a guess. sessions,
# projects and history.jsonl are the conversation; plugins and skills are also
# where --skills copies your own, so leaving either off would make that flag
# silently do nothing.
#
# .claude.json is the agent's global state: onboarding, trust and
# per-project settings. With CLAUDE_CONFIG_DIR set (see env: below) it lives
# inside the config directory rather than beside it, so it gets a hostmount
# like the conversation does. brig moves an older workspace's .claude.json
# into .claude once, before boot.
#
# What a live workspace also held and does NOT get one, so these are decisions
# rather than omissions: cache/, .last-update-result.json, policy-limits.json
# and remote-settings.json are all re-fetched, and backups/ holds snapshots of
# .claude.json, which are derived from a file that already survives.
#
# settings.json and CLAUDE.md are the user's own configuration -- the
# permission allowlist and the user-level memory -- written by hand or by the
# agent on the user's instruction, not re-fetched from anywhere. Without a
# hostmount the agent re-asks for permissions it was already granted on every
# boot, so they are exceptions for the same reason the conversation is.
#
# Anything under .claude NOT named here is ephemeral, including anything a
# future Claude Code version starts writing -- which is the cost of this design
# and is documented rather than hidden.
#
# size: is above 64m because this mount is an agent's home rather than a
# config directory: file-history grows with every edit and per-job scratch
# lands here too, and exhausting it surfaces as ENOSPC from the agent's own
# tools with nothing on the host watching.
#
# at: mounts the tmpfs at /brig/claude rather than at .claude in the home.
# The home is a share from the host, and a tmpfs whose mount point is a
# directory on that share can be dropped by the guest kernel when the host
# renames or replaces the directory under it (git clean -fdx on the host is
# enough). The path then leads back to host disk, and the next token refresh
# writes .credentials.json there. /brig/claude is on no share, so there is
# nothing on the host to lose. The paths below stay relative to the home:
# each hostmount is bound from .claude/<name> in the workspace to
# /brig/claude/<name>, and the credential is written to
# /brig/claude/.credentials.json.
#
# Order here is taste: brig mounts parents before children by path depth, so a
# hostmount listed above its tmpfs cannot silently lose the state it names.
volumes:
  - kind: tmpfs
    path: .claude
    at: /brig/claude
    size: 512m
  - kind: hostmount
    path: .claude/.claude.json
    file: true
  - kind: hostmount
    path: .claude/settings.json
    file: true
  - kind: hostmount
    path: .claude/CLAUDE.md
    file: true
  - kind: hostmount
    path: .claude/sessions
  - kind: hostmount
    path: .claude/projects
  - kind: hostmount
    path: .claude/plugins
  - kind: hostmount
    path: .claude/skills
  - kind: hostmount
    path: .claude/history.jsonl
    file: true

# GH_TOKEN travels as environment because brig's own git credential helper
# reads it there (internal/wrap/git.go: `[ -n "${GH_TOKEN:-}" ] || exit 0`), so
# moving it to a file means changing the helper first. Worth doing later -- the
# helper runs at credential-query time, so a file would let a rotated token
# reach a running agent -- but it is a code change, not a profile change.
#
# The chain is not decoration: env. first keeps `GH_TOKEN=$(gh auth token) brig
# run claude-code` working exactly as it always has, because a bound name is
# dropped from the ambient forward. secrets. second is the fallback for a shell
# that exports nothing.
#
# For git over HTTPS, not for the agent.
#
# IS_SANDBOX is load-bearing on root rather than informational. Claude Code
# refuses --dangerously-skip-permissions outright when it is running as root --
# "cannot be used with root/sudo privileges for security reasons" -- and this
# is what says the boundary is the VM rather than the account. Measured: with
# it unset the flag is refused, with it set the run proceeds.
#
# CLAUDE_CONFIG_DIR points the agent at the tmpfs volumes: mounts at
# /brig/claude. Claude Code reads both ~/.claude and ~/.claude.json from it
# when set, so nothing it writes lands in the home share. brig hands it to
# every process it starts in the sandbox, run, sh and exec alike.
env:
  - name: IS_SANDBOX
    value: "1"
  - name: CLAUDE_CONFIG_DIR
    value: /brig/claude
  - name: GH_TOKEN
    refs: [env.GH_TOKEN, secrets.gh-token]

# Both outrank Claude Code's subscription credential in its auth precedence, so
# forwarding either would move the sandbox onto metered API billing without
# saying so.
#
# The denylist guards the environment channel, and that is the channel that
# matters: these two are env-shaped by the agent's own design, and the risk it
# exists for is an ambient variable being swept in by accident. A files:
# binding cannot be an accident -- it takes an explicit stored secret and an
# explicit binding written by the profile author.
deny: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN]

# brig never writes to this host path -- the credential lives in the tmpfs
# above -- so a .credentials.json found in the workspace is a real token on
# disk. An older brig or an older workspace may have left it. Or a claude in
# the sandbox wrote it without CLAUDE_CONFIG_DIR, under sudo -i or su - for
# example: ~/.claude in the guest home is on the share now, not on a tmpfs.
staleCredentialFiles: [.claude/.credentials.json]

# statePaths is gone: volumes: above is the same list made load-bearing, and
# two lists that can disagree about what persists is the failure worth
# removing.

headless: true
mem: 4096
cpus: 4

# Not authentication: a first-run screen the guest cannot complete, because
# choosing a login method there opens a browser the microVM does not have.
# Never a credential -- those go through files: and env: above.
#
# Seeded in the workspace, at the path the hostmount above binds into
# /brig/claude, which is where CLAUDE_CONFIG_DIR has the agent read it.
onboarding:
  file: .claude/.claude.json
  seed:
    hasCompletedOnboarding: true
    hasTrustDialogAccepted: true
  trustKey: [projects, hasTrustDialogAccepted]
