name: cursor
desc: Cursor Agent -- example profile, image unpublished pending a terms check
binary: cursor-agent

# Built by community-images but deliberately never pushed, so this reference
# does not resolve. unpublished makes brig say that rather than surface a
# registry 404.
unpublished: true
image: ghcr.io/brig-sh/cursor:latest

# Leave network unset: Linux and hvi isolate; the default macOS backend, vz,
# falls back to shared because it cannot isolate networks.

guestHome: /home/cursor
env:
  - name: CURSOR_API_KEY
    ref: env.CURSOR_API_KEY
  - name: GH_TOKEN
    ref: env.GH_TOKEN
headless: true
mem: 4096
cpus: 4
