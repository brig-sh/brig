name: ubuntu
desc: A plain Ubuntu shell, running as root
kind: shell
binary: bash
image: docker.io/library/ubuntu:latest

# Boots as an ordinary OCI image: the image carries no kernel, so the
# runtime supplies one. hvi is the backend that path is built around.
hypervisor: hvi
genericBoot: true

# The workspace is mounted at /root/work rather than over the home directory:
# this guest runs as root and the point of it is the machine, not an agent's
# state. guestHome names where the workspace lands, which is what every path
# calculation needs.
guestHome: /root/work

forward: [GH_TOKEN]
mem: 2048
cpus: 2
