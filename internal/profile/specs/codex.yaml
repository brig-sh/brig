name: codex
desc: Codex (OpenAI)
binary: codex
image: ghcr.io/brig-sh/codex-stock:root

# Boots as an ordinary OCI image: the image carries no kernel, so the
# runtime supplies one. hvi is the backend that path is built around.
hypervisor: hvi
genericBoot: true
# The root account, which is what makes this work on a rootless Linux install:
# rootlesskit maps container uid 0 to the invoking user, so a root guest IS
# that user -- it opens /dev/kvm and owns the workspace it writes. A guest on
# 501 or 1000 lands on a subuid that owns nothing. It costs nothing on macOS,
# where hvi presents the host user's files as uid 0 by default.
#
# brig takes the guest account from the last element of this path.
guestHome: /root
forward: [GH_TOKEN]

# Codex signs in with `codex login --device-auth` and keeps the result in
# ~/.codex/auth.json, inside the persisted home. A forwarded OPENAI_API_KEY is
# the metered path and would take that decision away from you, so it is denied
# for the same reason ANTHROPIC_API_KEY is: put it in BRIG_FORWARD_ENV together
# with BRIG_ALLOW_DENIED=1 if metered billing is what you want.
deny: [OPENAI_API_KEY]

statePaths: [.codex]
headless: true
mem: 4096
cpus: 4
