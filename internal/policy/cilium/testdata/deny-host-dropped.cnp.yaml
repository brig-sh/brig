apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-host-dropped
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: '*'
  - toFQDNs:
    - matchName: api.anthropic.com
  enableDefaultDeny:
    egress: true
  endpointSelector: {}
