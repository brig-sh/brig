apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-default
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: '*'
  egressDeny:
  - toCIDR:
    - 203.0.113.0/24
  enableDefaultDeny:
    egress: false
  endpointSelector: {}
