# A deny default with host, glob and CIDR allows and a deny CIDR. The route
# brings in the rule to the node broker.
apiVersion: brig.sh/v1alpha1
kind: Policy
metadata:
  name: deny-default
spec:
  egress:
    default: deny
    allow:
      - host: api.anthropic.com
      - host: "*.githubusercontent.com"
      - cidr: 10.0.0.0/8
    deny:
      - cidr: 10.1.0.0/16
  routes:
    - name: anthropic
      preset: claude-code
      credential:
        secretRef: { name: claude-credentials }
