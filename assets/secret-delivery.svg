<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" role="img" aria-labelledby="dg-secrets-t dg-secrets-d">
<title id="dg-secrets-t">How a secret reaches the sandbox</title>
<desc id="dg-secrets-d">A run reads only Brig’s secret store. The secrets a profile names reach the sandbox: one as an environment variable, one as a file held in memory. Your login keychain, your SSH agent and other secret managers do not reach the sandbox.</desc>
<defs>
<filter id="sk-secrets" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
<marker id="ok-secrets" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #0E2233; }
  .dg-h { font-size: 16px; font-weight: 800; }
  .dg-b { font-weight: 700; }
  .dg-n { fill: #071521; }
  .dg-sub { font-size: 12.5px; fill: #4A5561; }
  .dg-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .dg-dim { fill: #6B7682; }
  rect, circle, path { fill: none; stroke: #0E2233; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bg { fill: #ffffff; stroke: none; }
  .dg-zone { fill: #F5F6F8; }
  .dg-vm { fill: #FDF5E6; stroke: #B9761C; stroke-width: 2.5; }
  .dg-box { fill: #ffffff; }
  .dg-on { stroke: #B9761C; stroke-width: 2.5; }
  .dg-off { stroke: #C9CFD6; stroke-dasharray: 5 5; }
  .dg-num { fill: #E7A33E; }
  .dg-ok { stroke: #E7A33E; stroke-width: 3.5; stroke-dasharray: 9 7; animation: flow 1s linear infinite; }
  .dg-head { fill: #E7A33E; stroke: none; }
  .dg-no { stroke: #C9CFD6; stroke-dasharray: 3 6; }
  .dg-x { stroke: #B4401A; stroke-width: 3; }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @media (prefers-reduced-motion: reduce) { .dg-ok { animation: none; } }
  @media (prefers-color-scheme: dark) {
    text { fill: #F2EFE6; }
    .dg-n { fill: #071521; }
    .dg-sub { fill: #C9D1D8; }
    .dg-dim { fill: #97A5B1; }
    rect, circle, path { stroke: #F2EFE6; }
    .bg { fill: #0E2233; stroke: none; }
    .dg-zone { fill: #13293B; }
    .dg-vm { fill: #2B2416; stroke: #E7A33E; }
    .dg-box { fill: #071521; }
    .dg-on { stroke: #E7A33E; }
    .dg-off { stroke: #35536B; }
    .dg-num { stroke: #071521; }
    .dg-no { stroke: #35536B; }
    .dg-x { stroke: #F18150; }
    .dg-head { stroke: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="820" height="370"/>
<g filter="url(#sk-secrets)">
<rect class="dg-zone" x="20" y="20" width="340" height="330" rx="3"/>
<rect class="dg-vm" x="480" y="20" width="320" height="330" rx="3"/>
<rect class="dg-box dg-off" x="40" y="72" width="300" height="34" rx="3"/>
<rect class="dg-box dg-off" x="40" y="116" width="300" height="34" rx="3"/>
<rect class="dg-box dg-off" x="40" y="160" width="300" height="34" rx="3"/>
<path class="dg-no" d="M340 89H400"/>
<path class="dg-x" d="M407 82L421 96M421 82L407 96"/>
<path class="dg-no" d="M340 133H400"/>
<path class="dg-x" d="M407 126L421 140M421 126L407 140"/>
<path class="dg-no" d="M340 177H400"/>
<path class="dg-x" d="M407 170L421 184M421 170L407 184"/>
<rect class="dg-box dg-on" x="40" y="226" width="300" height="100" rx="3"/>
<rect class="dg-box dg-on" x="500" y="226" width="280" height="44" rx="3"/>
<rect class="dg-box dg-on" x="500" y="282" width="280" height="44" rx="3"/>
<path class="dg-ok" d="M340 290C400 290 420 248 496 248" marker-end="url(#ok-secrets)"/>
<path class="dg-ok" d="M340 310C410 310 430 304 496 304" marker-end="url(#ok-secrets)"/>
</g>
<text x="40" y="50" class="dg-h">Your machine</text>
<text x="500" y="50" class="dg-h">Sandbox</text>
<text x="54" y="94" class="dg-dim">Your login keychain</text>
<text x="54" y="138" class="dg-dim">SSH agent</text>
<text x="54" y="182" class="dg-dim">Other secret managers</text>
<text x="54" y="250" class="dg-b">Brig secret store</text>
<text x="54" y="268" class="dg-sub">the only store a run reads</text>
<text x="54" y="294" class="dg-mono">gh-token</text>
<text x="54" y="314" class="dg-mono">claude-credentials</text>
<text x="514" y="245" class="dg-mono">GH_TOKEN</text>
<text x="514" y="261" class="dg-sub">an environment variable</text>
<text x="514" y="301" class="dg-mono">~/.claude/.credentials.json</text>
<text x="514" y="317" class="dg-sub">a file, held in memory</text>
<text x="640" y="110" class="dg-sub" text-anchor="middle">The agent gets the secrets</text>
<text x="640" y="128" class="dg-sub" text-anchor="middle">its profile names,</text>
<text x="640" y="146" class="dg-sub" text-anchor="middle">and no others.</text>
</svg>
