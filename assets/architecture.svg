<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img"
     aria-labelledby="title desc"
     font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title id="title">brig sandbox architecture</title>
  <desc id="desc">One command, brig run agent, resolves a session on the host and boots it as a microVM. On macOS the runtime is hull over Hypervisor.framework; on Linux it is urunc, a containerd runtime-v2 shim, over KVM. Both hosts give the guest the same contract: the workspace mounted as the agent home, credentials passed per exec, and a cosign-verified guest image.</desc>
  <style>
    svg { color: #253039; }
    .bg { fill: #fbfaf7; }
    .panel { fill: #f2f0ea; stroke: #a9b1b6; }
    .surface { fill: #fffefb; }
    .ink { fill: currentColor; }
    .muted { fill: #66737b; }
    .line { stroke: currentColor; }
    .ember { stroke: #c44d1b; }
    .ember-text { fill: #b84417; }
    .ember-soft { fill: #fff1e9; }
    @media (prefers-color-scheme: dark) {
      svg { color: #dbe3e8; }
      .bg { fill: #151a1e; }
      .panel { fill: #1d2429; stroke: #5f6f79; }
      .surface { fill: #171d21; }
      .muted { fill: #9cabb4; }
      .ember { stroke: #ee7440; }
      .ember-text { fill: #f18150; }
      .ember-soft { fill: #2c1d17; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="currentColor" stroke="none"/>
    </marker>
    <marker id="arrow-ember" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="ember-text" stroke="none"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="660"/>

  <g class="ink" stroke="none">
    <text x="34" y="38" font-size="20" font-weight="650">Agent sandbox architecture</text>
    <text x="34" y="59" class="muted" font-size="11.5">one CLI &#183; two host substrates &#183; one guest contract</text>
  </g>

  <!-- the session contract -->
  <rect x="274" y="82" width="572" height="62" rx="5" class="surface line" stroke-width="1.6"/>
  <g class="ink" stroke="none" text-anchor="middle">
    <text x="560" y="106" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13.5">brig run &lt;agent&gt;</text>
    <text x="560" y="128" font-size="11">one session contract &#183; workspace &#183; credentials &#183; egress</text>
  </g>
  <g class="line" stroke-width="1.3">
    <polyline points="490,144 490,164 285,164 285,176" marker-end="url(#arrow)"/>
    <polyline points="630,144 630,164 835,164 835,176" marker-end="url(#arrow)"/>
  </g>

  <!-- macOS path -->
  <rect x="30" y="178" width="510" height="282" rx="7" class="panel" stroke-width="1.2"/>
  <g class="ink" stroke="none">
    <text x="52" y="204" font-size="13" font-weight="650">macOS host &#183; Apple silicon</text>
  </g>

  <rect x="54" y="220" width="462" height="58" rx="4" class="surface line" stroke-width="1.5"/>
  <g class="ink" stroke="none">
    <text x="70" y="243" font-size="12.5" font-weight="650">brig</text>
    <text x="70" y="263" class="muted" font-size="10.8">resolves the agent template, the workspace and the credentials on the host</text>
  </g>

  <line x1="285" y1="278" x2="285" y2="300" class="line" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="54" y="302" width="462" height="58" rx="4" class="surface line" stroke-width="1.5"/>
  <g class="ink" stroke="none">
    <text x="70" y="325" font-size="12.5" font-weight="650">hull &#183; Vz / QEMU backends</text>
    <text x="70" y="345" class="muted" font-size="10.8">microVM runtime &#183; boots the guest image and mounts the workspace</text>
  </g>

  <line x1="285" y1="360" x2="285" y2="382" class="line" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="54" y="384" width="462" height="54" rx="4" class="surface line" stroke-width="1.4"/>
  <g class="ink" stroke="none" text-anchor="middle">
    <text x="285" y="407" font-size="11.5" font-weight="650">Hypervisor.framework</text>
    <text x="285" y="425" class="muted" font-size="10.5">host substrate</text>
  </g>

  <!-- Linux path -->
  <rect x="580" y="178" width="510" height="282" rx="7" class="panel" stroke-width="1.2"/>
  <g class="ink" stroke="none">
    <text x="602" y="204" font-size="13" font-weight="650">Linux host</text>
  </g>

  <rect x="604" y="220" width="462" height="58" rx="4" class="surface line" stroke-width="1.5"/>
  <g class="ink" stroke="none">
    <text x="620" y="243" font-size="12.5" font-weight="650">brig</text>
    <text x="620" y="263" class="muted" font-size="10.8">the same CLI and the same session contract</text>
  </g>

  <line x1="835" y1="278" x2="835" y2="300" class="line" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="604" y="302" width="462" height="58" rx="4" class="surface line" stroke-width="1.5"/>
  <g class="ink" stroke="none">
    <text x="620" y="325" font-size="12.5" font-weight="650">urunc &#183; containerd runtime-v2 shim</text>
    <text x="620" y="345" class="muted" font-size="10.8">io.containerd.urunc.v2 &#183; sandboxed containers as microVMs</text>
  </g>

  <line x1="835" y1="360" x2="835" y2="382" class="line" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="604" y="384" width="462" height="54" rx="4" class="surface line" stroke-width="1.4"/>
  <g class="ink" stroke="none" text-anchor="middle">
    <text x="835" y="407" font-size="11.5" font-weight="650">KVM</text>
    <text x="835" y="425" class="muted" font-size="10.5">host substrate</text>
  </g>

  <!-- into the guest -->
  <line x1="285" y1="460" x2="285" y2="498" class="ember" stroke-width="2" marker-end="url(#arrow-ember)"/>
  <line x1="835" y1="460" x2="835" y2="498" class="ember" stroke-width="2" marker-end="url(#arrow-ember)"/>

  <!-- the guest -->
  <rect x="30" y="500" width="1060" height="130" rx="7" class="ember" stroke-width="1.6"/>
  <text x="52" y="526" class="ember-text" stroke="none" font-size="13" font-weight="650">sandbox guest &#183; microVM</text>
  <text x="1068" y="526" class="muted" stroke="none" font-size="10.5" text-anchor="end">the same guest contract on both hosts</text>

  <rect x="54" y="542" width="330" height="70" rx="4" class="surface ember" stroke-width="1.8"/>
  <g class="ink" stroke="none">
    <text x="70" y="566" font-size="12.2" font-weight="650">workspace as guest home</text>
    <text x="70" y="586" class="muted" font-size="10.5">your project directory, mounted as the</text>
    <text x="70" y="601" class="muted" font-size="10.5">agent&#8217;s home. Nothing else is visible.</text>
  </g>

  <rect x="396" y="542" width="330" height="70" rx="4" class="surface ember" stroke-width="1.8"/>
  <g class="ink" stroke="none">
    <text x="412" y="566" font-size="12.2" font-weight="650">credentials per exec</text>
    <text x="412" y="586" class="muted" font-size="10.5">resolved on the host, passed to the agent</text>
    <text x="412" y="601" class="muted" font-size="10.5">process, never on the guest command line.</text>
  </g>

  <rect x="738" y="542" width="328" height="70" rx="4" class="surface ember" stroke-width="1.8"/>
  <g class="ink" stroke="none">
    <text x="754" y="566" font-size="12.2" font-weight="650">verified guest image</text>
    <text x="754" y="586" class="muted" font-size="10.5">cosign signature checked against</text>
    <text x="754" y="601" class="muted" font-size="10.5">ghcr.io/brig-sh before the guest boots.</text>
  </g>
</svg>
