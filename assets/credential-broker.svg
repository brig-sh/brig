<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="dg-broker-t dg-broker-d">
<title id="dg-broker-t">A request through the credential broker</title>
<desc id="dg-broker-d">The agent in the sandbox holds the route URL and a session token, and never the credential. It sends its request to brig.internal. brig-broker on your machine checks the token and the route's request.allow, reads the credential from Brig's secret store, adds it to the request, and sends the request to api.anthropic.com over a TLS connection of its own. The response streams back with the credential redacted. The credential does not reach the sandbox, and the policy refuses a direct connection from the sandbox.</desc>
<defs>
<filter id="sk-broker" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
<marker id="ok-broker" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #0E2233; }
  .dg-h { font-size: 16px; font-weight: 800; }
  .dg-b { font-weight: 700; }
  .dg-n { fill: #071521; }
  .dg-sub { font-size: 12.5px; fill: #4A5561; }
  .dg-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .dg-dim { fill: #6B7682; }
  rect, circle, path { fill: none; stroke: #0E2233; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bg { fill: #ffffff; stroke: none; }
  .dg-zone { fill: #F5F6F8; }
  .dg-vm { fill: #FDF5E6; stroke: #B9761C; stroke-width: 2.5; }
  .dg-box { fill: #ffffff; }
  .dg-on { stroke: #B9761C; stroke-width: 2.5; }
  .dg-off { stroke: #C9CFD6; stroke-dasharray: 5 5; }
  .dg-num { fill: #E7A33E; }
  .dg-ok { stroke: #E7A33E; stroke-width: 3.5; stroke-dasharray: 9 7; animation: flow 1s linear infinite; }
  .dg-head { fill: #E7A33E; stroke: none; }
  .dg-no { stroke: #C9CFD6; stroke-dasharray: 3 6; }
  .dg-x { stroke: #B4401A; stroke-width: 3; }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @media (prefers-reduced-motion: reduce) { .dg-ok { animation: none; } }
  @media (prefers-color-scheme: dark) {
    text { fill: #F2EFE6; }
    .dg-n { fill: #071521; }
    .dg-sub { fill: #C9D1D8; }
    .dg-dim { fill: #97A5B1; }
    rect, circle, path { stroke: #F2EFE6; }
    .bg { fill: #0E2233; stroke: none; }
    .dg-zone { fill: #13293B; }
    .dg-vm { fill: #2B2416; stroke: #E7A33E; }
    .dg-box { fill: #071521; }
    .dg-on { stroke: #E7A33E; }
    .dg-off { stroke: #35536B; }
    .dg-num { stroke: #071521; }
    .dg-no { stroke: #35536B; }
    .dg-x { stroke: #F18150; }
    .dg-head { stroke: none; }
  }
</style>
<rect class="bg" x="0" y="0" width="820" height="430"/>
<g filter="url(#sk-broker)">
<rect class="dg-vm" x="20" y="20" width="226" height="390" rx="3"/>
<rect class="dg-zone" x="336" y="130" width="464" height="280" rx="3"/>
<path class="dg-box" d="M478 106H662A22 22 0 0 0 670 66A30 30 0 0 0 622 32A36 36 0 0 0 552 24A32 32 0 0 0 496 50A30 30 0 0 0 478 106Z"/>
<rect class="dg-box dg-on" x="30" y="176" width="204" height="130" rx="3"/>
<rect class="dg-box dg-on" x="352" y="176" width="220" height="190" rx="3"/>
<rect class="dg-box" x="604" y="236" width="180" height="100" rx="3"/>
<circle class="dg-num" cx="372" cy="248" r="11"/>
<circle class="dg-num" cx="372" cy="280" r="11"/>
<circle class="dg-num" cx="372" cy="312" r="11"/>
<circle class="dg-num" cx="372" cy="344" r="11"/>
<path class="dg-ok" d="M240 258H346" marker-start="url(#ok-broker)" marker-end="url(#ok-broker)"/>
<path class="dg-ok" d="M604 286H578" marker-end="url(#ok-broker)"/>
<path class="dg-ok" d="M520 170V112" marker-start="url(#ok-broker)" marker-end="url(#ok-broker)"/>
<path class="dg-no" d="M196 176V90C196 72 206 66 224 66H436"/>
<path class="dg-x" d="M443 59L457 73M457 59L443 73"/>
<path class="dg-no" d="M694 336V390H276"/>
<path class="dg-x" d="M253 383L267 397M267 383L253 397"/>
</g>
<text x="36" y="50" class="dg-h">Sandbox</text>
<text x="352" y="160" class="dg-h">Your machine</text>
<text x="574" y="70" class="dg-mono" text-anchor="middle">api.anthropic.com</text>
<text x="574" y="89" class="dg-sub" text-anchor="middle">the route’s upstream</text>
<text x="262" y="56" class="dg-mono">egress: default: deny</text>
<text x="262" y="86" class="dg-sub">a direct connection</text>
<text x="532" y="152" class="dg-sub">the broker’s own TLS</text>
<text x="42" y="201" class="dg-mono dg-b">claude</text>
<text x="42" y="229" class="dg-mono">ANTHROPIC_BASE_URL</text>
<text x="42" y="246" class="dg-sub">the route URL</text>
<text x="42" y="274" class="dg-mono">CLAUDE_CODE_OAUTH_TOKEN</text>
<text x="42" y="291" class="dg-sub">a session token for the route</text>
<text x="291" y="246" class="dg-sub" text-anchor="middle">brig.internal</text>
<text x="366" y="201" class="dg-mono dg-b">brig-broker</text>
<text x="366" y="219" class="dg-sub">one per host</text>
<text x="372" y="253" class="dg-b dg-n" text-anchor="middle">1</text>
<text x="392" y="253">checks the token</text>
<text x="372" y="285" class="dg-b dg-n" text-anchor="middle">2</text>
<text x="392" y="285">checks <tspan class="dg-mono">request.allow</tspan></text>
<text x="372" y="317" class="dg-b dg-n" text-anchor="middle">3</text>
<text x="392" y="317">adds the credential</text>
<text x="372" y="349" class="dg-b dg-n" text-anchor="middle">4</text>
<text x="392" y="349">redacts the reply</text>
<text x="618" y="262" class="dg-b">Brig secret store</text>
<text x="618" y="286" class="dg-mono">claude-credentials</text>
<text x="618" y="306" class="dg-sub">refreshed on the host</text>
<text x="618" y="322" class="dg-sub">and written back</text>
<text x="368" y="382" class="dg-sub">the credential stays on the host</text>
<text x="128" y="340" class="dg-sub" text-anchor="middle">The agent holds a token</text>
<text x="128" y="358" class="dg-sub" text-anchor="middle">for its route, and never</text>
<text x="128" y="376" class="dg-sub" text-anchor="middle">the credential.</text>
</svg>
