# The prerelease channels: a build people can install and try before there is
# a release, or a release candidate, to try.
#
# Two of them, and they are deliberately separate rather than one channel with
# two sources.
#
#   main          follows the tip of main, republished on every merge. This is
#                 "what is coming", and it moves on its own.
#   experimental  is promoted by hand from any ref, which is how an unmerged
#                 branch reaches a tester. It moves only when someone asks.
#
# Folding them together would mean a merge to main silently replacing the
# branch build a tester was halfway through checking.
#
# Neither is a release. Each publishes to a moving tag, so the assets under
# `channel-main` and `channel-experimental` are replaced in place and nothing
# accumulates. `skip_upload: auto` on the stable cask is untouched: that is
# GoReleaser's, it runs on a v-tag, and nothing here creates one.
name: channel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to publish to the experimental channel"
        required: true

permissions:
  contents: write

concurrency:
  # One publish per channel at a time. Two racing runs would move the same tag
  # and leave the tap's cask naming assets the release no longer has.
  group: channel-${{ github.event_name == 'workflow_dispatch' && 'experimental' || 'main' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Work out which channel this is
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "name=experimental"
              echo "ref=${{ github.event.inputs.ref }}"
              echo "source=${{ github.event.inputs.ref }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "name=main"
              echo "ref=${{ github.sha }}"
              echo "source=the tip of main"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.channel.outputs.ref }}
          # goreleaser reads the tag history to derive the version this build
          # is the successor to, so a shallow clone gives it the wrong answer.
          fetch-depth: 0

      # The version a channel build carries. Homebrew decides there is
      # something to upgrade to from the version string alone, so two builds
      # of a moving channel must never share one -- hence the date and the
      # short SHA. The leading component is the last release, so the string
      # still says roughly where this build sits.
      - name: Compose the version
        id: version
        run: |
          set -euo pipefail
          BASE="$(cat VERSION)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "value=${BASE}-${{ steps.channel.outputs.name }}.$(date -u +%Y%m%d).${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      # --snapshot builds every archive and publishes nothing, which is what
      # this job wants: the release below is a moving tag rather than the
      # v-tag release GoReleaser knows how to make.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip=sbom,sign
        env:
          CHANNEL_VERSION: ${{ steps.version.outputs.value }}

      # Moved rather than created. A channel is one release whose assets are
      # replaced, so a year of merges to main leaves one tag and one release
      # rather than a release per commit.
      - name: Publish to the channel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: channel-${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          NOTES="Built from ${{ steps.channel.outputs.source }} at $(git rev-parse --short HEAD). Not a release."
          TITLE="${{ steps.channel.outputs.name }} channel"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The old assets carry the previous build's version in their name,
            # so --clobber does not replace them and they would accumulate
            # until the release listed every build ever made.
            gh release view "$TAG" --json assets -q '.assets[].name' | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --prerelease --target "$(git rev-parse HEAD)" \
              --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --target "$(git rev-parse HEAD)" \
              --title "$TITLE" --notes "$NOTES"
          fi
          # checksums.txt as well as the archives: the tap's CI asks each
          # release whether it really published the sha256 its cask claims,
          # and a channel cask has to answer that the same way a stable one
          # does.
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber

      - name: Render the cask
        env:
          V: ${{ steps.version.outputs.value }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail
          OTHER=experimental
          [ "$CHANNEL" = "experimental" ] && OTHER=main
          python3 script/render-cask.py \
            --project brig --channel "$CHANNEL" --version "$V" \
            --repo brig-sh/brig --tag "channel-$CHANNEL" --dist dist \
            --archive "on_macos:on_arm:brig-$V-darwin-arm64.tar.gz" \
            --archive "on_macos:on_intel:brig-$V-darwin-amd64.tar.gz" \
            --archive "on_linux:on_arm:brig-$V-linux-arm64.tar.gz" \
            --archive "on_linux:on_intel:brig-$V-linux-amd64.tar.gz" \
            --desc "Run a coding agent in a microVM sandbox with only the credentials it needs" \
            --source "${{ steps.channel.outputs.source }}" \
            --binary brig --binary brigd \
            --completion bash --completion zsh --completion fish \
            --depends-cask "brig-sh/brig/hull@$CHANNEL" --depends-formula cosign \
            --conflicts-with "$OTHER" \
            --out "brig@$CHANNEL.rb"

      # Pushed to the tap rather than opened as a pull request, which is the
      # one place this differs from the stable cask. That cask is what people
      # install and a bad one deserves a second pair of eyes; a channel cask
      # is regenerated on every merge, and a pull request per merge is noise
      # nobody would read.
      - name: Update the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          V: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/brig-sh/homebrew-brig.git" /tmp/tap
          cp "brig@$CHANNEL.rb" "/tmp/tap/Casks/brig@$CHANNEL.rb"
          cd /tmp/tap
          git config user.name "brig-sh-bot"
          git config user.email "bot@brig.sh"
          git add "Casks/brig@$CHANNEL.rb"
          git diff --cached --quiet && { echo "the cask is unchanged"; exit 0; }
          git commit -m "chore(cask): brig@$CHANNEL $V"
          git push
