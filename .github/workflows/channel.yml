# The prerelease channels: a build people can install and try before there is
# a release, or a release candidate, to try.
#
# Two of them, and they are deliberately separate rather than one channel with
# two sources.
#
#   main          follows the tip of main, republished on every merge. This is
#                 "what is coming", and it moves on its own.
#   experimental  is promoted by hand from any ref, which is how an unmerged
#                 branch reaches a tester. It moves only when someone asks.
#
# Folding them together would mean a merge to main silently replacing the
# branch build a tester was halfway through checking.
#
# Neither is a release. Each build is a prerelease of its own, under a tag
# only that build uses, and the older builds of a channel are deleted once the
# tap has moved on. `skip_upload: auto` on the stable cask is untouched: that
# is GoReleaser's, it runs on a v-tag, and nothing here creates one.
name: channel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to publish to the experimental channel"
        required: true

permissions:
  contents: write

concurrency:
  # One publish per channel at a time. Two racing runs could push the tap's
  # cask in either order, and the older build could land last.
  group: channel-${{ github.event_name == 'workflow_dispatch' && 'experimental' || 'main' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Notarizing waits on Apple for up to 20 minutes (.goreleaser.yaml). This
    # bounds a run that hangs, which would otherwise hold the channel's
    # concurrency group and queue every later merge behind it.
    timeout-minutes: 60
    steps:
      # The dispatch input reaches bash through the environment, never through
      # a ${{ }} substitution: an expression is pasted into the script before
      # bash reads it, so a ref carrying a quote or a $(...) would run as
      # shell in a job that can write to this repository. It is also checked
      # against what a ref can contain, because the same value ends up inside
      # a Ruby string in the cask.
      - name: Work out which channel this is
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event.inputs.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$REF" in
              *[!A-Za-z0-9._/-]*|"")
                echo "$REF is not a branch, tag or SHA" >&2; exit 1;;
            esac
            {
              echo "name=experimental"
              echo "ref=$REF"
              echo "source=$REF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "name=main"
              echo "ref=$SHA"
              echo "source=the tip of main"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.channel.outputs.ref }}
          # The Go toolchain derives the pseudo-version this build reports from
          # the nearest tag, so a shallow clone gives it the wrong answer.
          fetch-depth: 0
          # An experimental build checks out a ref somebody asked for, and this
          # job can write to the repository. The default checkout leaves its
          # token in the git config, where anything that ref runs -- a
          # goreleaser hook, the renderer -- could reach it. The two pushes
          # below are given a token explicitly instead.
          persist-credentials: false

      # The workflow's own commit, kept apart from the ref being built. The
      # renderer and the goreleaser config are run from here, so promoting a
      # branch does not mean running that branch's copy of either -- which is
      # also what lets a ref cut before this workflow existed be promoted at
      # all.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          persist-credentials: false

      # actions/checkout takes a path under the workspace, so the checkout
      # above lands inside the tree being built. Go's VCS stamping runs `git
      # status --porcelain`, which lists untracked paths, so without this every
      # channel build is stamped +dirty. That reaches CHANNEL_VERSION, and from
      # there the archive names, which GitHub then rewrites on upload.
      #
      # info/exclude rather than .gitignore: a ref cut before this workflow
      # existed carries no entry for it, and promoting one of those is a case
      # this workflow keeps working.
      - name: Keep the workflow checkout out of the built tree's status
        run: echo '/.workflow/' >> .git/info/exclude

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      # goreleaser checks the tree before its hooks run, so its `go mod tidy`
      # hook could change go.mod or go.sum afterwards and nothing would fail --
      # a snapshot build does not refuse a dirty tree. The binaries would then
      # report a +dirty version that no longer matches the one the cask names.
      # Tidy here first and stop on any change, the way release.yml does.
      - name: Check the tree stays clean after go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

      # The version is read off a binary rather than composed here. The Go
      # toolchain stamps every binary with the pseudo-version it derives from
      # the commit, which is already unique per build -- which is all Homebrew
      # needs to see that there is something to upgrade to -- and it means the
      # asset names, the cask version and what the binary says about itself
      # are one string rather than three that can disagree.
      #
      # `go version -m` reads the stamp without running the binary. An
      # experimental build is whatever ref somebody promoted, and later steps
      # of this job hold a token for this repository and one for the tap. A
      # step that ran that ref's code could leave something behind for them.
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/brig" ./cmd/brig
          v="$(go version -m "$RUNNER_TEMP/brig" | awk '$1 == "mod" { print $3; exit }')"
          v="${v#v}"
          case "$v" in
            "" | "(devel)") echo "the binary carries no module version" >&2; exit 1 ;;
          esac
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # A channel build is signed and notarized like a release. The
      # prerelease channels section of docs/releasing.md says why. The key is
      # staged the way release.yml does.
      - name: Stage the notary key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"

      # --snapshot builds every archive and publishes nothing, which is what
      # this job wants: the release below is a per-build prerelease rather
      # than the v-tag release GoReleaser knows how to make.
      - uses: goreleaser/goreleaser-action@v7
        with:
          # The major ci.yml checks .goreleaser.yaml against and release.yml
          # runs, so a new major cannot change what the channel signs.
          version: "~> v2"
          # The `before` hooks are skipped: `go mod tidy` ran above with the
          # tree checked afterwards, and `go test ./...` runs in CI on every
          # merge to main. Running tidy here would dirty the tree after
          # goreleaser has already read it.
          args: release --snapshot --clean --skip=before,sbom,sign --config .workflow/.goreleaser.yaml
        env:
          CHANNEL_VERSION: ${{ steps.version.outputs.value }}
          # The certificate and notary key release.yml passes, under the
          # names goreleaser reads. MACOS_SIGN_P12 is what turns on the
          # notarize block in .goreleaser.yaml.
          MACOS_SIGN_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          MACOS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}

      # Each build is a release of its own, under a tag no other build uses.
      # Releases in this org are immutable: once published, a release takes no
      # more assets, and its tag can neither move nor be deleted while the
      # release exists. So nothing is replaced in place. The release is
      # created as a draft, the one state that accepts assets, and published
      # once it holds them. The previous build's release stays until the tap
      # has moved on; see the pruning step below.
      #
      # The tag goes on a commit made for it: an empty commit on top of the
      # one this build was made from, with the same tree. Nothing is built on
      # top of it, so no later commit on main has it as an ancestor.
      # goreleaser takes a release's version from the nearest tag, and
      # git.ignore_tags only matches whole names, so a per-build tag on main
      # itself would become the nearest tag for the next release.
      - name: Publish the channel release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.value }}
          SOURCE: ${{ steps.channel.outputs.source }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail
          TAG="channel-$CHANNEL-$V"
          BUILT="$(git rev-parse --short HEAD)"
          SIDE="$(git -c user.name=brig-sh-bot -c user.email=bot@brig.sh \
            commit-tree 'HEAD^{tree}' -p HEAD \
            -m "brig $V, the $CHANNEL channel build of $BUILT")"
          # The checkout persisted no credentials, so the push is given one.
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$SIDE:refs/tags/$TAG"
          # checksums.txt as well as the archives: the tap's CI asks each
          # release whether it really published the sha256 its cask claims,
          # and a channel cask has to answer that the same way a stable one
          # does.
          gh release create "$TAG" --draft --prerelease --verify-tag \
            --title "brig $V ($CHANNEL channel)" \
            --notes "Built from $SOURCE at $BUILT. Not a release." \
            dist/*.tar.gz dist/checksums.txt
          gh release edit "$TAG" --draft=false
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Render the cask
        env:
          V: ${{ steps.version.outputs.value }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          SOURCE: ${{ steps.channel.outputs.source }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          OTHER=experimental
          [ "$CHANNEL" = "experimental" ] && OTHER=main
          python3 .workflow/script/render-cask.py \
            --project brig --channel "$CHANNEL" --version "$V" \
            --repo brig-sh/brig --tag "$TAG" --dist dist \
            --archive "on_macos:on_arm:brig-$V-darwin-arm64.tar.gz" \
            --archive "on_macos:on_intel:brig-$V-darwin-amd64.tar.gz" \
            --archive "on_linux:on_arm:brig-$V-linux-arm64.tar.gz" \
            --archive "on_linux:on_intel:brig-$V-linux-amd64.tar.gz" \
            --desc "Run a coding agent in a microVM sandbox with only the credentials it needs" \
            --source "$SOURCE" \
            --binary brig --binary brigd \
            --completion bash --completion zsh --completion fish \
            --depends-cask "brig-sh/brig/hull@$CHANNEL" --depends-formula cosign \
            --conflicts-with "$OTHER" \
            --out "brig@$CHANNEL.rb"

      # The same bot App token release.yml uses for the tap, with the same PAT
      # fallback. The push below relies on this App being a bypass actor on
      # the tap's main ruleset, which requires a reviewed pull request from
      # anyone else.
      - uses: actions/create-github-app-token@v3
        id: tap-token
        continue-on-error: true
        with:
          app-id: ${{ vars.NOFIRE_BOT_APP_ID }}
          private-key: ${{ secrets.NOFIRE_BOT_PRIVATE_KEY }}
          owner: brig-sh
          repositories: homebrew-brig

      # Pushed rather than opened as a pull request, unlike the stable cask: a
      # channel cask is regenerated on every merge, and a reviewed PR per merge
      # is noise nobody reads. hull's channel publishes the same way.
      - name: Update the tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          V: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "no token for the tap" >&2; exit 1; }
          rm -rf "$RUNNER_TEMP/tap"
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/brig-sh/homebrew-brig.git" "$RUNNER_TEMP/tap"
          cp "brig@$CHANNEL.rb" "$RUNNER_TEMP/tap/Casks/brig@$CHANNEL.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "brig-sh-bot"
          git config user.email "bot@brig.sh"
          git add "Casks/brig@$CHANNEL.rb"
          git diff --cached --quiet && { echo "the cask is unchanged"; exit 0; }
          # -s: the tap's DCO check reads the trailer.
          git commit -s -m "chore(cask): brig@$CHANNEL $V"
          # Rebased and retried rather than pushed once. brig and hull each
          # publish two channels into this one repository, and nothing
          # serializes across the four. They touch different files, so a
          # rebase always applies.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            # A push the tap's rules refuse fails the same way every time.
            # Retry only when main has moved.
            git fetch --quiet origin main
            if git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "the tap refused the push and main has not moved" >&2
              exit 1
            fi
            echo "the tap moved under this push; rebasing (attempt $attempt)"
            git rebase --quiet FETCH_HEAD
            sleep $((attempt * 2))
          done
          echo "the tap could not be updated after five attempts" >&2
          exit 1

      # Every build leaves a release and a tag behind, so the older ones go
      # once the tap names the new build. The newest three published builds
      # are kept: an install that read the previous cask a moment ago still
      # finds its files. Deleting a published release is allowed, and its tag
      # can go once the release has. The name cannot be used again, which a
      # per-build tag never needs.
      #
      # A run that failed part way leaves a draft, or a tag with no release at
      # all. Neither is installable, so neither counts towards the three, and
      # both are removed here. The concurrency group keeps another publish of
      # this channel from running meanwhile, so nothing here is in flight.
      - name: Prune the older builds of this channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PREFIX="channel-$CHANNEL-"
          RELEASES="$(gh release list --limit 200 --json tagName,createdAt,isDraft \
            --jq ".[] | select(.tagName | startswith(\"$PREFIX\")) | [.createdAt, .tagName, (.isDraft | tostring)] | @tsv")"
          printf '%s\n' "$RELEASES" | awk -F'\t' '$3 == "false"' \
            | sort -r | cut -f2 | tail -n +4 | while read -r old; do
              [ -n "$old" ] && [ "$old" != "$TAG" ] || continue
              echo "removing the older build $old"
              gh release delete "$old" --cleanup-tag --yes
            done
          printf '%s\n' "$RELEASES" | awk -F'\t' '$3 == "true" {print $2}' | while read -r draft; do
            [ -n "$draft" ] && [ "$draft" != "$TAG" ] || continue
            echo "removing the draft $draft, left by a run that did not finish"
            gh release delete "$draft" --cleanup-tag --yes
          done
          # Read from a variable, not a pipe: under pipefail a grep -q that
          # stops reading early can fail the writer, which would read as no
          # match and delete a tag that has a release.
          KNOWN="$(printf '%s\n' "$RELEASES" | cut -f2)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$PREFIX" \
            --jq '.[].ref | ltrimstr("refs/tags/")' | while read -r tag; do
              [ -n "$tag" ] && [ "$tag" != "$TAG" ] || continue
              if grep -qxF -- "$tag" <<< "$KNOWN"; then continue; fi
              echo "removing the tag $tag, which has no release"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            done
